<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="vignette-c-logo" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#181512" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#0E0D0C" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#080707" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="gold-c-logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C97A"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7B36"/>
    </linearGradient>
    <style>
      .serif-display { font-family: 'Cinzel', 'Cormorant Garamond', 'Didot', 'Playfair Display', 'Georgia', serif; }
      .mono-tech { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    </style>
  </defs>

  <rect width="400" height="400" fill="#080707"/>
  <rect width="400" height="400" fill="url(#vignette-c-logo)"/>
  
  <!-- Outer Archival Border -->
  <rect x="16" y="16" width="368" height="368" fill="none" stroke="#C5A059" stroke-width="0.75" stroke-opacity="0.4"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#C5A059" stroke-width="0.5" stroke-dasharray="3,5" stroke-opacity="0.25"/>

  <!-- Da Vinci Astrolabe & Compass Rings -->
  <g transform="translate(200, 200)" stroke="#C5A059" fill="none">
    <circle cx="0" cy="0" r="145" stroke-width="0.8" stroke-opacity="0.5"/>
    <circle cx="0" cy="0" r="125" stroke-width="0.5" stroke-dasharray="2,4" stroke-opacity="0.3"/>
    <circle cx="0" cy="0" r="90" stroke-width="0.5" stroke-opacity="0.2"/>
    <circle cx="0" cy="0" r="45" stroke-width="0.5" stroke-opacity="0.15"/>
    <line x1="-155" y1="0" x2="155" y2="0" stroke-width="0.5" stroke-dasharray="3,5" stroke-opacity="0.2"/>
    <line x1="0" y1="-155" x2="0" y2="155" stroke-width="0.5" stroke-dasharray="3,5" stroke-opacity="0.2"/>
    <line x1="-110" y1="-110" x2="110" y2="110" stroke-width="0.4" stroke-opacity="0.2"/>
    <line x1="-110" y1="110" x2="110" y2="-110" stroke-width="0.4" stroke-opacity="0.2"/>

    <!-- Compass Degree Ticks -->
    <line x1="0" y1="-145" x2="0" y2="-137" stroke-width="0.8"/>
    <line x1="0" y1="145" x2="0" y2="137" stroke-width="0.8"/>
    <line x1="-145" y1="0" x2="-137" y2="0" stroke-width="0.8"/>
    <line x1="145" y1="0" x2="137" y2="0" stroke-width="0.8"/>

    <!-- Golden Spiral Curve -->
    <path d="M0,0 A15,15 0 0,1 15,15 A30,30 0 0,1 -15,45 A60,60 0 0,1 -75,-15 A105,105 0 0,1 30,-105" 
          stroke="url(#gold-c-logo)" stroke-width="1.2" stroke-opacity="0.65" stroke-dasharray="2,3"/>

    <!-- Luxury Serif Monogram 'C' -->
    <text x="0" y="32" fill="#FDFBF7" font-size="96" text-anchor="middle" class="serif-display" stroke="none">C</text>

    <!-- Celestial Micro Pivot -->
    <circle cx="0" cy="-60" r="2.5" fill="#E8C97A" stroke="none"/>
    <text x="0" y="85" fill="#C5A059" font-size="8" text-anchor="middle" class="mono-tech" stroke="none" opacity="0.7">CARTOGRAPH</text>
    <text x="0" y="98" fill="#C5A059" font-size="6" text-anchor="middle" class="mono-tech" stroke="none" opacity="0.4">Φ = 1.618</text>
  </g>
</svg>