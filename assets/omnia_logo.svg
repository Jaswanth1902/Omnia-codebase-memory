<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="vignette-omnia-logo" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#151419" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#0E0D12" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#08080B" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="gold-omnia-logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D98D"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#96722C"/>
    </linearGradient>
    <style>
      .serif-display { font-family: 'Cinzel', 'Cormorant Garamond', 'Didot', 'Playfair Display', 'Georgia', serif; }
      .mono-tech { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#08080B"/>
  <rect width="400" height="400" fill="url(#vignette-omnia-logo)"/>

  <!-- Outer Architectural Frame -->
  <rect x="16" y="16" width="368" height="368" fill="none" stroke="#C5A059" stroke-width="0.75" stroke-opacity="0.4"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#C5A059" stroke-width="0.5" stroke-dasharray="3,5" stroke-opacity="0.25"/>

  <!-- Astrolabe & AST Graph Motif -->
  <g transform="translate(200, 195)" stroke="#C5A059" fill="none">
    <circle cx="0" cy="0" r="145" stroke-width="0.8" stroke-opacity="0.35"/>
    <circle cx="0" cy="0" r="110" stroke-width="0.5" stroke-dasharray="2,4" stroke-opacity="0.25"/>
    <line x1="-155" y1="0" x2="155" y2="0" stroke-width="0.4" stroke-opacity="0.2"/>
    <line x1="0" y1="-155" x2="0" y2="155" stroke-width="0.4" stroke-opacity="0.2"/>

    <!-- AST Tree Nodes (Abstract Syntax Tree Geometry) -->
    <!-- Root Node -->
    <circle cx="0" cy="-65" r="7" fill="#18161E" stroke="url(#gold-omnia-logo)" stroke-width="1.2"/>
    <circle cx="0" cy="-65" r="2.5" fill="#F2D98D" stroke="none"/>
    
    <!-- Level 1 Branches -->
    <line x1="0" y1="-58" x2="-45" y2="-15" stroke-width="0.8" stroke-opacity="0.6"/>
    <line x1="0" y1="-58" x2="45" y2="-15" stroke-width="0.8" stroke-opacity="0.6"/>
    
    <!-- Level 1 Nodes -->
    <circle cx="-45" cy="-15" r="5.5" fill="#18161E" stroke="#C5A059" stroke-width="0.9"/>
    <circle cx="45" cy="-15" r="5.5" fill="#18161E" stroke="#C5A059" stroke-width="0.9"/>

    <!-- Level 2 Branches -->
    <line x1="-45" y1="-9.5" x2="-75" y2="35" stroke-width="0.6" stroke-opacity="0.4" stroke-dasharray="2,2"/>
    <line x1="-45" y1="-9.5" x2="-20" y2="35" stroke-width="0.6" stroke-opacity="0.4" stroke-dasharray="2,2"/>
    <line x1="45" y1="-9.5" x2="20" y2="35" stroke-width="0.6" stroke-opacity="0.4" stroke-dasharray="2,2"/>
    <line x1="45" y1="-9.5" x2="75" y2="35" stroke-width="0.6" stroke-opacity="0.4" stroke-dasharray="2,2"/>

    <!-- Level 2 Leaf Nodes -->
    <circle cx="-75" cy="35" r="3.5" fill="#C5A059" stroke="none"/>
    <circle cx="-20" cy="35" r="3.5" fill="#C5A059" stroke="none"/>
    <circle cx="20" cy="35" r="3.5" fill="#C5A059" stroke="none"/>
    <circle cx="75" cy="35" r="3.5" fill="#C5A059" stroke="none"/>

    <!-- Monogram 'Ω' / 'O' -->
    <text x="0" y="85" fill="#FDFBF7" font-size="54" text-anchor="middle" class="serif-display" stroke="none">Ω</text>

    <text x="0" y="112" fill="#C5A059" font-size="8" text-anchor="middle" class="mono-tech" stroke="none" opacity="0.8">O M N I A</text>
    <text x="0" y="125" fill="#C5A059" font-size="6" text-anchor="middle" class="mono-tech" stroke="none" opacity="0.4">AST MCP • &lt;10MS</text>
  </g>
</svg>
