<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#181512" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0E0D0C" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080707" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C97A"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7B36"/>
    </linearGradient>
    <style>
      .serif-title { font-family: 'Cinzel', 'Cormorant Garamond', 'Didot', 'Playfair Display', 'Baskerville', 'Georgia', serif; font-weight: 400; }
      .serif-sub { font-family: 'Cormorant Garamond', 'Baskerville', 'Georgia', serif; font-style: italic; }
      .mono-tech { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="#090808"/>
  <rect width="1200" height="420" fill="url(#vignette)"/>

  <!-- Architectural Frame & Corner Accents -->
  <rect x="24" y="24" width="1152" height="372" fill="none" stroke="#C5A059" stroke-width="0.75" stroke-opacity="0.35"/>
  <rect x="28" y="28" width="1144" height="364" fill="none" stroke="#C5A059" stroke-width="0.5" stroke-dasharray="4,6" stroke-opacity="0.2"/>
  
  <!-- Corner Rosettes / Quadrant Marks -->
  <g stroke="#C5A059" stroke-width="0.8" opacity="0.6">
    <path d="M20 24 h16 M24 20 v16"/>
    <path d="M1180 24 h-16 M1176 20 v16"/>
    <path d="M20 396 h16 M24 392 v16"/>
    <path d="M1180 396 h-16 M1176 392 v16"/>
    <circle cx="24" cy="24" r="3" fill="none"/>
    <circle cx="1176" cy="24" r="3" fill="none"/>
    <circle cx="24" cy="396" r="3" fill="none"/>
    <circle cx="1176" cy="396" r="3" fill="none"/>
  </g>

  <!-- Da Vinci Astrolabe & Coordinate Grid (Left Cluster) -->
  <g transform="translate(220, 210)" stroke="#C5A059" fill="none">
    <!-- Fine Blueprint Coordinate Grid -->
    <g stroke-width="0.4" stroke-opacity="0.12" stroke-dasharray="3,5">
      <line x1="-190" y1="0" x2="190" y2="0"/>
      <line x1="0" y1="-170" x2="0" y2="170"/>
      <circle cx="0" cy="0" r="160"/>
      <circle cx="0" cy="0" r="130"/>
      <circle cx="0" cy="0" r="95"/>
      <circle cx="0" cy="0" r="60"/>
      <circle cx="0" cy="0" r="28"/>
    </g>

    <!-- Celestial Coordinate Ray Lines -->
    <g stroke-width="0.5" stroke-opacity="0.25">
      <line x1="-140" y1="-140" x2="140" y2="140"/>
      <line x1="-140" y1="140" x2="140" y2="-140"/>
      <line x1="-160" y1="-60" x2="160" y2="60"/>
      <line x1="-60" y1="-160" x2="60" y2="160"/>
    </g>

    <!-- Compass Degree Ticks -->
    <g stroke-width="0.8" stroke-opacity="0.5">
      <circle cx="0" cy="0" r="145" stroke-width="0.75"/>
      <line x1="0" y1="-145" x2="0" y2="-137"/>
      <line x1="0" y1="145" x2="0" y2="137"/>
      <line x1="-145" y1="0" x2="-137" y2="0"/>
      <line x1="145" y1="0" x2="137" y2="0"/>
      <line x1="-102" y1="-102" x2="-96" y2="-96"/>
      <line x1="102" y1="-102" x2="96" y2="-96"/>
      <line x1="-102" y1="102" x2="-96" y2="96"/>
      <line x1="102" y1="102" x2="96" y2="96"/>
    </g>

    <!-- Golden Ratio Spiral (Φ = 1.618) Arc -->
    <path d="M0,0 A20,20 0 0,1 20,20 A40,40 0 0,1 -20,60 A80,80 0 0,1 -100,-20 A140,140 0 0,1 40,-140" 
          stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.7" stroke-dasharray="2,3"/>

    <!-- Da Vinci Annotations / Mechanical Ticks -->
    <text x="-175" y="-150" fill="#C5A059" opacity="0.4" font-size="9" class="mono-tech">FIG. I — MEMORY TOPOLOGY</text>
    <text x="-175" y="165" fill="#C5A059" opacity="0.4" font-size="8" class="mono-tech">COORD [0x7F4A:0x18B2] • Φ=1.618</text>
    <circle cx="40" cy="-140" r="3" fill="#E8C97A" opacity="0.8"/>
    <circle cx="-100" cy="-20" r="2.5" fill="#C5A059" opacity="0.6"/>
    <circle cx="20" cy="20" r="2" fill="#C5A059" opacity="0.6"/>
  </g>

  <!-- Typography & Semantic Hierarchy (Center-Right Cluster) -->
  <g transform="translate(460, 0)">
    <!-- Supertitle / Categorical Badge -->
    <text x="0" y="125" fill="#C5A059" font-size="12" letter-spacing="4" class="serif-title" opacity="0.85">
      AST-GROUNDED CODEBASE MEMORY &amp; SPATIAL ATLAS
    </text>

    <!-- Main Title (Cinzel / Editorial Serif) -->
    <text x="0" y="185" fill="#FDFBF7" font-size="52" letter-spacing="12" class="serif-title">
      CARTOGRAPH
    </text>

    <!-- Bohemian Golden Ratio Divider -->
    <g transform="translate(0, 210)" stroke="#C5A059" opacity="0.6">
      <line x1="0" y1="0" x2="420" y2="0" stroke-width="0.8"/>
      <circle cx="210" cy="0" r="3" fill="#C5A059"/>
      <circle cx="105" cy="0" r="1.5" fill="#C5A059"/>
      <circle cx="315" cy="0" r="1.5" fill="#C5A059"/>
    </g>

    <!-- Subtitle / Technical Capabilities -->
    <text x="0" y="245" fill="#C5BEB3" font-size="15" letter-spacing="2" class="serif-title" opacity="0.9">
      DETERMINISTIC AST PARSING • VECTOR RETRIEVAL • MCP SERVER
    </text>

    <text x="0" y="275" fill="#8C857B" font-size="13" class="serif-sub">
      Persistent spatial reasoning for autonomous coding agents with zero context hallucination.
    </text>

    <!-- Technical Metadata Badges (Monospace & Serif Fusion) -->
    <g transform="translate(0, 315)">
      <rect x="0" y="0" width="130" height="24" rx="2" fill="#151311" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="65" y="16" fill="#C5A059" font-size="10" text-anchor="middle" class="mono-tech">AST-INDEXED</text>

      <rect x="142" y="0" width="140" height="24" rx="2" fill="#151311" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="212" y="16" fill="#C5A059" font-size="10" text-anchor="middle" class="mono-tech">MODEL-AGNOSTIC</text>

      <rect x="294" y="0" width="140" height="24" rx="2" fill="#151311" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="364" y="16" fill="#C5A059" font-size="10" text-anchor="middle" class="mono-tech">MCP COMPLIANT</text>
    </g>

    <!-- Archival Date & Philosophy Stamp -->
    <text x="0" y="365" fill="#5C564E" font-size="9" letter-spacing="2" class="mono-tech">
      EX NIHILO AD ASTRA • ANNO MMXXVI • OPEN SOURCE ATELIER
    </text>
  </g>
</svg>