<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <radialGradient id="vignette-omnia" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141318" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#0E0D12" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#08080B" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="gold-omnia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D98D"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#96722C"/>
    </linearGradient>
    <style>
      .serif-title { font-family: 'Cinzel', 'Cormorant Garamond', 'Didot', 'Playfair Display', 'Baskerville', 'Georgia', serif; font-weight: 400; }
      .serif-sub { font-family: 'Cormorant Garamond', 'Baskerville', 'Georgia', serif; font-style: italic; }
      .mono-tech { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="#08080B"/>
  <rect width="1200" height="420" fill="url(#vignette-omnia)"/>

  <!-- Architectural Frame -->
  <rect x="24" y="24" width="1152" height="372" fill="none" stroke="#C5A059" stroke-width="0.75" stroke-opacity="0.35"/>
  <rect x="28" y="28" width="1144" height="364" fill="none" stroke="#C5A059" stroke-width="0.5" stroke-dasharray="4,6" stroke-opacity="0.2"/>

  <!-- Corner Rosettes -->
  <g stroke="#C5A059" stroke-width="0.8" opacity="0.6">
    <path d="M20 24 h16 M24 20 v16"/>
    <path d="M1180 24 h-16 M1176 20 v16"/>
    <path d="M20 396 h16 M24 392 v16"/>
    <path d="M1180 396 h-16 M1176 392 v16"/>
    <circle cx="24" cy="24" r="3" fill="none"/>
    <circle cx="1176" cy="24" r="3" fill="none"/>
    <circle cx="24" cy="396" r="3" fill="none"/>
    <circle cx="1176" cy="396" r="3" fill="none"/>
  </g>

  <!-- Left Cluster: AST Abstract Syntax Graph & Astrolabe Blueprint -->
  <g transform="translate(220, 210)" stroke="#C5A059" fill="none">
    <!-- Blueprint Radial Concentrics -->
    <g stroke-width="0.4" stroke-opacity="0.15" stroke-dasharray="2,4">
      <circle cx="0" cy="0" r="160"/>
      <circle cx="0" cy="0" r="115"/>
      <circle cx="0" cy="0" r="70"/>
      <line x1="-175" y1="0" x2="175" y2="0"/>
      <line x1="0" y1="-155" x2="0" y2="155"/>
    </g>

    <!-- AST Syntax Graph Blueprint -->
    <g stroke="url(#gold-omnia)" stroke-width="1.1">
      <!-- Root AST Module Node -->
      <circle cx="0" cy="-75" r="9" fill="#18161E" stroke-width="1.4"/>
      <circle cx="0" cy="-75" r="3" fill="#F2D98D" stroke="none"/>
      <text x="0" y="-90" fill="#C5A059" font-size="8" text-anchor="middle" class="mono-tech" stroke="none" opacity="0.7">ast.Module</text>

      <!-- Primary Branches -->
      <path d="M0,-66 L-65,-15"/>
      <path d="M0,-66 L65,-15"/>
      <path d="M0,-66 L0,-15"/>

      <!-- Level 1 Nodes -->
      <circle cx="-65" cy="-15" r="7" fill="#18161E" stroke-width="1.2"/>
      <circle cx="0" cy="-15" r="7" fill="#18161E" stroke-width="1.2"/>
      <circle cx="65" cy="-15" r="7" fill="#18161E" stroke-width="1.2"/>

      <text x="-65" y="-27" fill="#C5A059" font-size="7" text-anchor="middle" class="mono-tech" stroke="none" opacity="0.6">ClassDef</text>
      <text x="0" y="-27" fill="#C5A059" font-size="7" text-anchor="middle" class="mono-tech" stroke="none" opacity="0.6">FunctionDef</text>
      <text x="65" y="-27" fill="#C5A059" font-size="7" text-anchor="middle" class="mono-tech" stroke="none" opacity="0.6">AsyncDef</text>

      <!-- Secondary Leaf Nodes -->
      <path d="M-65,-8 L-95,45" stroke-width="0.7" stroke-dasharray="2,2"/>
      <path d="M-65,-8 L-35,45" stroke-width="0.7" stroke-dasharray="2,2"/>
      <path d="M65,-8 L35,45" stroke-width="0.7" stroke-dasharray="2,2"/>
      <path d="M65,-8 L95,45" stroke-width="0.7" stroke-dasharray="2,2"/>

      <circle cx="-95" cy="45" r="4.5" fill="#C5A059" stroke="none"/>
      <circle cx="-35" cy="45" r="4.5" fill="#C5A059" stroke="none"/>
      <circle cx="35" cy="45" r="4.5" fill="#C5A059" stroke="none"/>
      <circle cx="95" cy="45" r="4.5" fill="#C5A059" stroke="none"/>

      <!-- SQLite WAL Symbol Indexer -->
      <rect x="-70" y="85" width="140" height="28" rx="4" fill="#121117" stroke="#C5A059" stroke-width="0.8"/>
      <text x="0" y="103" fill="#F2D98D" font-size="8.5" text-anchor="middle" class="mono-tech" stroke="none">SQLite FTS5 + AST WAL</text>
    </g>

    <!-- Compass Rose Marker -->
    <circle cx="0" cy="0" r="3" fill="#C5A059"/>
  </g>

  <!-- Right Cluster: Luxury Typography & Manifesto -->
  <g transform="translate(500, 100)">
    <!-- Category Supertitle -->
    <text x="0" y="30" fill="#C5A059" font-size="11" letter-spacing="4" class="mono-tech" opacity="0.85">MODEL CONTEXT PROTOCOL (MCP) • ZERO-VECTOR CODEBASE MEMORY</text>
    
    <!-- Title Line -->
    <text x="0" y="85" fill="#FDFBF7" font-size="46" letter-spacing="5" class="serif-title">O M N I A</text>

    <!-- Accent Rule -->
    <line x1="0" y1="105" x2="620" y2="105" stroke="url(#gold-omnia)" stroke-width="1.2"/>
    <circle cx="0" cy="105" r="2.5" fill="#C5A059"/>
    <circle cx="620" cy="105" r="2.5" fill="#C5A059"/>

    <!-- Subtitle -->
    <text x="0" y="135" fill="#E5C77A" font-size="16" class="serif-sub" letter-spacing="1">Deterministic AST Symbol Indexing &amp; Real-Time Context Injection</text>

    <!-- Engineering Spec Grid -->
    <g transform="translate(0, 160)">
      <!-- Box 1: Latency -->
      <rect x="0" y="0" width="140" height="54" rx="4" fill="#121117" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="16" y="22" fill="#8E857B" font-size="7.5" class="mono-tech">SYMBOL LOOKUP</text>
      <text x="16" y="42" fill="#FDFBF7" font-size="14" class="mono-tech" font-weight="bold">&lt; 10 ms</text>

      <!-- Box 2: Memory -->
      <rect x="155" y="0" width="140" height="54" rx="4" fill="#121117" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="171" y="22" fill="#8E857B" font-size="7.5" class="mono-tech">RAM FOOTPRINT</text>
      <text x="171" y="42" fill="#FDFBF7" font-size="14" class="mono-tech" font-weight="bold">&lt; 45 MB</text>

      <!-- Box 3: Accuracy -->
      <rect x="310" y="0" width="140" height="54" rx="4" fill="#121117" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="326" y="22" fill="#8E857B" font-size="7.5" class="mono-tech">HALLUCINATION</text>
      <text x="326" y="42" fill="#FDFBF7" font-size="14" class="mono-tech" font-weight="bold">0.0% AST</text>

      <!-- Box 4: Protocol -->
      <rect x="465" y="0" width="145" height="54" rx="4" fill="#121117" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="481" y="22" fill="#8E857B" font-size="7.5" class="mono-tech">AGENT PROTOCOL</text>
      <text x="481" y="42" fill="#F2D98D" font-size="13" class="mono-tech" font-weight="bold">MCP STDIO</text>
    </g>

    <!-- Minimal Terminal Hook -->
    <g transform="translate(0, 235)">
      <rect x="0" y="0" width="610" height="32" rx="3" fill="#0C0B0F" stroke="#C5A059" stroke-width="0.5" stroke-opacity="0.3"/>
      <circle cx="14" cy="16" r="3" fill="#C5A059" opacity="0.6"/>
      <text x="26" y="20" fill="#9B9083" font-size="8.5" class="mono-tech">uvx omnia-codebase-memory --workspace .</text>
      <text x="590" y="20" fill="#C5A059" font-size="7" text-anchor="end" class="mono-tech" opacity="0.5">SUB-10MS AST</text>
    </g>
  </g>
</svg>
